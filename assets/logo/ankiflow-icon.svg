<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- back card -->
  <rect x="342" y="282" width="340" height="460" rx="52" fill="#FFFFFF" opacity="0.32" transform="rotate(-14 512 512)"/>
  <!-- front card -->
  <g filter="url(#shadow)" transform="rotate(6 512 512)">
    <rect x="342" y="282" width="340" height="460" rx="52" fill="#FFFFFF"/>
  </g>
  <!-- AI sparkle -->
  <path d="M512 392 Q512 512 632 512 Q512 512 512 632 Q512 512 392 512 Q512 512 512 392 Z" fill="url(#spark)" transform="rotate(6 512 512)"/>
  <path d="M612 352 Q612 392 652 392 Q612 392 612 432 Q612 392 572 392 Q612 392 612 352 Z" fill="url(#spark)" opacity="0.85" transform="rotate(6 512 512)"/>
</svg>
